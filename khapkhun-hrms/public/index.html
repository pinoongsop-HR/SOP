<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Vận Hành · KhạpKhun &amp; Pinoong</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="logo">KK</div>
    <h1>KhạpKhun · Pinoong</h1>
    <div class="sub">Đăng nhập bằng mã nhân viên + mã PIN 4 số</div>
    <div class="login-error hidden" id="loginError"></div>
    <form id="loginForm">
      <label>Mã nhân viên</label>
      <input type="text" id="loginCode" autocomplete="username" placeholder="VD: NV001" required>
      <label>Mã PIN (4 số)</label>
      <input type="password" id="loginPin" class="pin-input" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="current-password" placeholder="••••" required>
      <button type="submit" id="loginBtn">Đăng nhập</button>
    </form>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div class="app hidden" id="appShell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">KK</div>
      <div class="txt"><b>KhạpKhun · Pinoong</b><span>Vận hành SOP · KPI</span></div>
    </div>
    <nav id="navButtons"></nav>
    <div class="sidebar-foot">
      <div class="who" id="sidebarName">—</div>
      <div class="role" id="sidebarRole">—</div>
      <button class="btn btn-sm" id="changePinBtn" style="width:100%; margin-bottom:6px;">Đổi mã PIN</button>
      <button class="btn btn-sm" id="logoutBtn" style="width:100%;">Đăng xuất</button>
    </div>
  </aside>

  <main class="main">
    <section id="view-checklist" class="view"></section>
    <section id="view-team" class="view"></section>
    <section id="view-kpi" class="view"></section>
    <section id="view-staff" class="view"></section>
  </main>
</div>

<!-- ===================== MODALS ===================== -->
<div class="modal-backdrop" id="pinModalBackdrop">
  <div class="modal">
    <div class="modal-head"><h3>Đổi mã PIN</h3><button class="close-x" data-close-modal="pinModalBackdrop">&times;</button></div>
    <div class="modal-body">
      <div class="form-row"><label class="flabel">PIN hiện tại</label><input type="password" id="pinOld" maxlength="4" inputmode="numeric"></div>
      <div class="form-row"><label class="flabel">PIN mới (4 số)</label><input type="password" id="pinNew" maxlength="4" inputmode="numeric"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close-modal="pinModalBackdrop">Huỷ</button>
      <button class="btn btn-primary" id="savePinBtn">Lưu</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="staffModalBackdrop">
  <div class="modal">
    <div class="modal-head"><h3 id="staffModalTitle">Thêm nhân sự</h3><button class="close-x" data-close-modal="staffModalBackdrop">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="f_id">
      <div class="form-row"><label class="flabel">Họ và tên</label><input type="text" id="f_name" required></div>
      <div class="form-grid">
        <div class="form-row"><label class="flabel">Mã nhân viên</label><input type="text" id="f_code" placeholder="VD: NV001"></div>
        <div class="form-row"><label class="flabel">Mã PIN (4 số)</label><input type="password" id="f_pin" maxlength="4" inputmode="numeric" placeholder="Để trống nếu không đổi"></div>
      </div>
      <div class="form-row"><label class="flabel">Vị trí</label><select id="f_position" style="width:100%;"></select></div>
      <div class="form-grid">
        <div class="form-row"><label class="flabel">Chi nhánh</label><select id="f_branch" style="width:100%;"><option>Khạp Khun</option><option>Pinoong</option></select></div>
        <div class="form-row"><label class="flabel">Số điện thoại</label><input type="tel" id="f_phone"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label class="flabel">Ngày vào làm</label><input type="date" id="f_start"></div>
        <div class="form-row"><label class="flabel">Trạng thái</label><select id="f_status" style="width:100%;"><option>Đang làm</option><option>Thử việc</option><option>Nghỉ việc</option></select></div>
      </div>
      <div class="form-row">
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; cursor:pointer;">
          <input type="checkbox" id="f_isAdmin" style="width:16px;height:16px;"> Cấp quyền Admin (thấy &amp; sửa toàn bộ hệ thống)
        </label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close-modal="staffModalBackdrop">Huỷ</button>
      <button class="btn btn-primary" id="saveStaffBtn">Lưu nhân sự</button>
    </div>
  </div>
</div>

<div class="emp-detail-overlay" id="detailOverlay"></div>
<div class="emp-detail" id="detailPanel"></div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
